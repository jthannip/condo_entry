; =============================================================
; Condo Entry - SIP endpoints
;   100 = Lobby panel
;   101 = Suite 101
;   102 = Suite 102
; =============================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; --- Docker Desktop (Windows/macOS) only ---
; Replace 192.168.1.50 with YOUR computer's LAN IP (ipconfig / ifconfig).
; Without these, calls connect but you get no audio.
external_media_address=10.0.0.151
external_signaling_address=10.0.0.151
external_signaling_port=5061

; ---------- Shared settings for every phone ----------
[endpoint-template](!)
type=endpoint
context=condo
disallow=all
allow=ulaw,alaw
direct_media=no          ; keep audio flowing through Asterisk (needed with Docker NAT)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733        ; needed on Day 2 for "press 9 to unlock"

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30     ; Asterisk pings each phone; shows up in diagnostics later

; ---------- 100: Lobby panel ----------
[100](endpoint-template)
auth=100
aors=100
callerid="Lobby" <100>

[100](auth-template)
username=100
password=LobbyPass100

[100](aor-template)

; ---------- 101: Suite 101 ----------
[101](endpoint-template)
auth=101
aors=101
callerid="Suite 101" <101>

[101](auth-template)
username=101
password=SuitePass101

[101](aor-template)

; ---------- 102: Suite 102 ----------
[102](endpoint-template)
auth=102
aors=102
callerid="Suite 102" <102>

[102](auth-template)
username=102
password=SuitePass102

[102](aor-template)
