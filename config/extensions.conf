[general]
static=yes
writeprotect=no

[globals]
; Node.js backend (the "api" service in docker-compose.yml)
API=http://api:3000

[condo]
; ---- Call a suite: dial 101 to 109 (add phones in pjsip.conf; no change needed here) ----
exten => _10[1-9],1,NoOp(Lobby ${CALLERID(num)} calling Suite ${EXTEN})
 ; "__" = variable is copied to the suite's channel too, so the unlock handler can read it
 same => n,Set(__SUITE=${EXTEN})
 same => n,Set(__VISITOR=${CALLERID(num)})
 ; b(...) runs suite-features on the SUITE's side before it rings,
 ; so only the resident (not the lobby) can press 9 / 0
 same => n,Dial(PJSIP/${EXTEN},30,b(suite-features^s^1))
 same => n,Hangup()

; ---- Echo test: dial 600 to check your own audio ----
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; ---- Runs when any call in this context ends: log the call result ----
exten => h,1,GotoIf($["${SUITE}" = ""]?done)
 same => n,System(curl -s -m 2 "${API}/api/call?suite=${SUITE}&from=${VISITOR}&status=${DIALSTATUS}")
 same => n(done),NoOp(Call ended: ${DIALSTATUS})

; ---- Enables the 9 / 0 keys on the resident's channel ----
[suite-features]
exten => s,1,Set(DYNAMIC_FEATURES=unlock#deny)
 same => n,Return()

; ---- Resident pressed 9 ----
[door-unlock]
exten => s,1,NoOp(Suite ${SUITE} pressed 9: UNLOCK)
 same => n,System(curl -s -m 2 "${API}/api/door?action=unlock&suite=${SUITE}&from=${VISITOR}")
 same => n,Playback(beep)
 same => n,Return()

; ---- Resident pressed 0 ----
[door-deny]
exten => s,1,NoOp(Suite ${SUITE} pressed 0: DENY)
 same => n,System(curl -s -m 2 "${API}/api/door?action=deny&suite=${SUITE}&from=${VISITOR}")
 same => n,Return()
